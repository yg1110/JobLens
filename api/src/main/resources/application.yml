spring:
  application:
    name: api

  datasource:
    url: ${POSTGRES_DB:jdbc:postgresql://localhost:5432/joblens}
    username: ${POSTGRES_USER:joblens}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  docker:
    compose:
      file: api/docker-compose.yml

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

joblens:
  scoring:
    hardFilter:
      contract:
        - "계약직"
        - "기간제"
        - "계약 사원"
