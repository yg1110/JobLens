<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobLens 즉시 추천</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: #1a1a2e;
      background-color: #f0f2f5;
    }
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .header {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: #ffffff;
      padding: 24px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      background: rgba(255,255,255,0.25);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }
    .content {
      padding: 20px 24px;
    }
    .item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 12px;
      background: #fafafa;
      transition: border-color 0.2s;
    }
    .item:last-child { margin-bottom: 0; }
    .item-title {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 6px;
    }
    .item-meta {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .item-score {
      display: inline-block;
      background: #6366f1;
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      margin-right: 8px;
    }
    .item-stack {
      font-size: 12px;
      color: #6b7280;
      margin-top: 8px;
    }
    .item-link {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      background: #6366f1;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="header">
        <h1>즉시 추천 공고</h1>
        <span class="badge">{{COUNT}}건</span>
      </div>
      <div class="content">
        {{ITEMS}}
      </div>
    </div>
    <div class="footer">JobLens · 채용 공고 추천</div>
  </div>
</body>
</html>
