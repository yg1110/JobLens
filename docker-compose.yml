# JobLens — Crawler + API + PostgreSQL 로컬 통합 실행
# 루트에서: docker compose up -d (또는 docker-compose up -d)

services:
  postgres:
    image: postgres:16
    container_name: joblens-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-joblens}
      POSTGRES_USER: ${DB_USERNAME:-joblens}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - joblens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-joblens} -d ${DB_NAME:-joblens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  crawler:
    build:
      context: ./crawler
      dockerfile: Dockerfile
    container_name: joblens-crawler
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # 크롤 결과 JSON은 컨테이너 내 /app 에 저장됨. 영속화 시 예: volumes: - ./crawler/output:/app

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: joblens-api
    depends_on:
      postgres:
        condition: service_healthy
      crawler:
        condition: service_healthy
    environment:
      POSTGRES_DB: jdbc:postgresql://postgres:5432/${DB_NAME:-joblens}
      POSTGRES_USER: ${DB_USERNAME:-joblens}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JOBLENS_CRAWLER_BASE_URL: http://crawler:8000
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-true}
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"

volumes:
  joblens_pgdata:
